openapi: 3.1.0
info:
  title: UniFi API - matilda.network (Local Console and Site Manager Cloud)
  version: 2.0.0
  summary: Reference for the UniFi Cloud Key Gen2 Plus console (official Integration API, controller API, UniFi OS) and UniFi Site Manager.
  description: |
    Merged from three Postman exports (UniFi APIController, UniFi Network API, UniFi CloudKey API), then extended with the
    full official Integration API and Site Manager API endpoint sets for completeness.

    ## How this reference is organised
    Each operation appears under exactly one tag, prefixed by the API it belongs to:

    | Prefix | Base path | Auth | Stability |
    |---|---|---|---|
    | **Integration** | `https://{host}/proxy/network/integration/v1` | `ApiKey` (local key) | Official, versioned |
    | **Controller** | `https://{host}/proxy/network/api/s/{site}` and `/proxy/network/v2/api/site/{site}` | `ControllerSession` (+ `CsrfToken` on writes) | Undocumented, community reverse-engineered; may change between Network Application releases |
    | **UniFi OS** | `https://{host}/api/...` | `ControllerSession` | Undocumented |
    | **Cloud** | `https://api.ui.com` | `ApiKey` (cloud key) | Official; `/ea/` paths are Early Access |

    ## Getting started
    1. **Integration API:** create a key in *Network > Settings > Control Plane > Integrations*, send it as `X-API-KEY`.
       Call `listLocalSites` first; the returned `id` is `{siteId}` for every other Integration call (see the **Links** on that response).
    2. **Controller API:** call `localLogin`. Keep the `TOKEN` cookie, and echo the `X-CSRF-Token` response header on every
       state-changing request. `{site}` is the site *name*, normally `default`.
    3. **Cloud:** create a key at <https://unifi.ui.com/settings/api-keys>, send it as `X-API-KEY` to `api.ui.com`.

    ## Conventions
    - Operations that change state carry `x-destructive: true` (shown under each operation). Per the project change-management
      rule, firewall, VLAN and tunnel changes need a written plan and approval before use.
    - `{siteId}` is the site UUID (Integration API). `{site}` is the site name, normally `default` (controller API).
    - List endpoints in the Integration API page with `offset`/`limit` and filter with `filter` (see the `Filter` parameter).
      Cloud list endpoints page with `pageSize`/`nextToken`.
    - Examples are placeholders: documentation-range MACs (`00:00:5e:00:53:xx`), RFC 5737 public IPs, invented UUIDs.
      The console's management address `192.168.1.2` is the common Cloud Key default and is published deliberately.

    ## Removed during cleansing
    Not applicable to this network and not part of the official APIs: IPsec/site VPN creation via the controller API, static routes,
    LTE backup, dynamic DNS, DPI and SSL inspection settings (both off), reboot/power-off, Postman scaffolding (`/users`, `/health`,
    `/rate_limit`, `/info`, `/auth/*`), UI locale asset files, Wi-Fi 6E and UNMS items, and all captured secrets.
    Legacy firewall rules are listed (read-only, deprecated) for completeness; the site uses the zone-based firewall.

    ## Caveats
    - Integration API paths are confirmed against the maintained Art-of-WiFi client. Request/response shapes for firewall policies,
      ACL rules, DNS policies, Wi-Fi security and traffic matching lists are partial and set `additionalProperties: true`.
      Check against the console's own built-in API docs (*Settings > Control Plane > Integrations*) before writing.
    - Controller-API schemas are deliberately partial (fields of interest only).
    - `/v1/dpi/applications` in the cloud Postman export was mislabelled; it is a local Integration endpoint and is listed there.
  contact:
    name: matilda.network (jaseonline)
    url: https://github.com/jaseonline/unifi-swagger
  license:
    name: Internal use
    identifier: LicenseRef-Internal
externalDocs:
  description: Ubiquiti developer documentation (official APIs)
  url: https://developer.ui.com/
servers:
  - url: https://{host}
    description: Local console (Cloud Key Gen2 Plus, self-signed certificate)
    variables:
      host:
        default: 192.168.1.2
        description: Console IP or DNS name on the management LAN
tags:
  - name: Auth
    description: UniFi OS console login/logout. Produces the session used by the **Controller** and **UniFi OS** tags.
  - name: Integration · Application
    description: Application info and sites. Start here to obtain `{siteId}`.
    externalDocs: {description: 'Network API reference', url: 'https://developer.ui.com/network-api/'}
  - name: Integration · Devices
    description: Adopted and pending UniFi devices, statistics, device and port actions.
  - name: Integration · Clients
    description: Connected clients and guest authorisation.
  - name: Integration · Networks
    description: Networks (VLANs) and what references them.
  - name: Integration · WiFi
    description: Wi-Fi broadcasts (SSIDs).
  - name: Integration · Firewall
    description: Zone-based firewall - zones, policies, policy ordering, traffic matching lists.
  - name: Integration · ACL rules
    description: Switch ACL rules (layer 2/3 filtering enforced on switches).
  - name: Integration · DNS
    description: Local DNS records and domain forwarding.
  - name: Integration · Hotspot
    description: Guest hotspot vouchers. Not used on this site (guest WLAN uses a passphrase); listed for completeness.
  - name: Integration · Supporting resources
    description: Read-only lookups - WANs, VPN servers and tunnels, RADIUS profiles, device tags, countries, DPI catalogue.
  - name: Controller · System
    description: Undocumented controller endpoints for health, events, alarms and backups.
    externalDocs: {description: 'Community API notes (Art-of-WiFi)', url: 'https://github.com/Art-of-WiFi/UniFi-API-client'}
  - name: Controller · Devices
    description: Undocumented device endpoints (ports, radios, topology).
  - name: Controller · Clients
    description: Undocumented client endpoints (known clients, fixed IPs, block/kick/forget).
  - name: Controller · Networks
    description: Undocumented network configuration and DHCP lease endpoints.
  - name: Controller · Firewall
    description: Undocumented firewall group, zone and matrix endpoints.
  - name: UniFi OS · System
    description: Console-level (UniFi OS) settings, firmware and backups.
  - name: Cloud · Hosts
    description: Consoles linked to the UI account.
    externalDocs: {description: 'Site Manager API reference', url: 'https://developer.ui.com/site-manager-api/'}
  - name: Cloud · Sites
    description: Network application sites across all consoles.
  - name: Cloud · Devices
    description: Devices across all consoles.
  - name: Cloud · ISP metrics
    description: Early Access. WAN latency, packet loss, uptime and throughput history.
  - name: Cloud · SD-WAN
    description: Early Access. SD-WAN (Site Magic) configurations and deployment status.
security:
  - ApiKey: []
paths:
  # ================================================================== AUTH (UniFi OS)
  /api/auth/login:
    post:
      operationId: localLogin
      summary: Log in to the console (session cookie)
      description: |
        Returns a `TOKEN` cookie and an `X-CSRF-Token` response header, both required by the controller API.
        Use a local-only admin account; MFA (`token`) is needed only for UI-account logins with 2FA.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, examples: [api-readonly]}
                password: {type: string, format: password, writeOnly: true}
                token: {type: string, description: 'One-time MFA code if enabled', examples: ['123456']}
                rememberMe: {type: boolean, default: false, description: 'Extends the session lifetime'}
            examples:
              localAccount:
                summary: Local admin account
                value: {username: api-readonly, password: '<from Keeper>', rememberMe: false}
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              description: '`TOKEN=<jwt>; path=/; secure; httponly; samesite=none`'
              schema: {type: string}
            X-CSRF-Token:
              description: Echo this on every state-changing request.
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  unique_id: {type: string}
                  username: {type: string}
                  isOwner: {type: boolean}
                  isSuperAdmin: {type: boolean}
          links:
            healthAfterLogin:
              operationId: getSiteHealth
              description: The session cookie now authorises controller calls such as site health.
              parameters: {site: default}
        '400': {$ref: '#/components/responses/LegacyBadRequest'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
        '429':
          description: Too many failed login attempts; the console blocks the source for a period.
          headers:
            Retry-After: {$ref: '#/components/headers/Retry-After'}
  /api/auth/logout:
    post:
      operationId: localLogout
      summary: Log out (invalidate the session)
      tags: [Auth]
      security: [{ControllerSession: [], CsrfToken: []}]
      responses:
        '200': {description: 'Logged out; the `TOKEN` cookie is cleared'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  # ================================================================== INTEGRATION API (local, official)
  /proxy/network/integration/v1/info:
    get:
      operationId: getApplicationInfo
      summary: Get Network application info
      description: Cheapest call to confirm the API key works and read the Network Application version.
      tags: [Integration · Application]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationVersion: {type: string, examples: ['11.0.81']}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /proxy/network/integration/v1/sites:
    get:
      operationId: listLocalSites
      summary: List local sites
      description: The site UUID returned here is `{siteId}` for all other Integration API calls.
      tags: [Integration · Application]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SitePage'}
          links:
            listDevices:
              operationId: listAdoptedDevices
              parameters: {siteId: '$response.body#/data/0/id'}
            listClients:
              operationId: listConnectedClients
              parameters: {siteId: '$response.body#/data/0/id'}
            listNetworks:
              operationId: listNetworks
              parameters: {siteId: '$response.body#/data/0/id'}
            listFirewallZones:
              operationId: listIntegrationFirewallZones
              parameters: {siteId: '$response.body#/data/0/id'}
            listWifiBroadcasts:
              operationId: listWifiBroadcasts
              parameters: {siteId: '$response.body#/data/0/id'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  # ------------------------------------------------------------------ Devices
  /proxy/network/integration/v1/sites/{siteId}/devices:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      operationId: listAdoptedDevices
      summary: List adopted devices
      description: Filterable on `id`, `macAddress`, `ipAddress`, `name`, `model`, `state`, `supported`, `firmwareVersion`, `firmwareUpdatable`, `features`, `interfaces`.
      tags: [Integration · Devices]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevicePage'}
          links:
            getDevice:
              operationId: getDeviceDetails
              parameters: {siteId: '$request.path.siteId', deviceId: '$response.body#/data/0/id'}
            getDeviceStats:
              operationId: getLatestDeviceStatistics
              parameters: {siteId: '$request.path.siteId', deviceId: '$response.body#/data/0/id'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: adoptDevice
      summary: Adopt a pending device
      description: Adopts a device discovered by `listPendingDevices`.
      x-destructive: true
      tags: [Integration · Devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [macAddress]
              properties:
                macAddress: {$ref: '#/components/schemas/MacAddress'}
                ignoreDeviceLimit: {type: boolean, default: false, description: 'Adopt even if the console''s device limit is reached'}
      responses:
        '200':
          description: Adoption started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceDetails'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /proxy/network/integration/v1/sites/{siteId}/devices/{deviceId}:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/DeviceId'}
    get:
      operationId: getDeviceDetails
      summary: Get device details
      description: Includes per-port and per-radio detail.
      tags: [Integration · Devices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceDetails'}
          links:
            uplinkDevice:
              operationId: getDeviceDetails
              description: The device this one uplinks to.
              parameters: {siteId: '$request.path.siteId', deviceId: '$response.body#/uplink/deviceId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: removeDevice
      summary: Remove (forget) an adopted device
      description: The device is factory-reset on its next contact and must be re-adopted.
      x-destructive: true
      tags: [Integration · Devices]
      responses:
        '200': {description: 'Device removed'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /proxy/network/integration/v1/sites/{siteId}/devices/{deviceId}/statistics/latest:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/DeviceId'}
    get:
      operationId: getLatestDeviceStatistics
      summary: Get latest device statistics
      description: Point-in-time CPU, memory, load, uplink throughput and radio retry figures.
      tags: [Integration · Devices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceStatistics'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /proxy/network/integration/v1/sites/{siteId}/devices/{deviceId}/actions:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/DeviceId'}
    post:
      operationId: executeDeviceAction
      summary: Execute a device action (restart)
      x-destructive: true
      tags: [Integration · Devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceActionRequest'}
            examples:
              restart: {summary: 'Restart the device', value: {action: RESTART}}
      responses:
        '200': {description: 'Action accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /proxy/network/integration/v1/sites/{siteId}/devices/{deviceId}/interfaces/ports/{portIdx}/actions:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/DeviceId'}
      - name: portIdx
        in: path
        required: true
        description: Port number as shown in the UI (`idx` in `getDeviceDetails`).
        schema: {type: integer, minimum: 1, examples: [5]}
    post:
      operationId: executePortAction
      summary: Execute a port action (PoE power-cycle)
      description: Power-cycles the PoE output on one switch port; the attached device loses power briefly.
      x-destructive: true
      tags: [Integration · Devices]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PortActionRequest'}
            examples:
              powerCycle: {summary: 'Power-cycle PoE', value: {action: POWER_CYCLE}}
      responses:
        '200': {description: 'Action accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /proxy/network/integration/v1/pending-devices:
    get:
      operationId: listPendingDevices
      summary: List devices pending adoption
      description: Not site-scoped. Devices on the LAN that are factory-default and visible to this console.
      tags: [Integration · Devices]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PendingDevicePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  # ------------------------------------------------------------------ Clients
  /proxy/network/integration/v1/sites/{siteId}/clients:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      operationId: listConnectedClients
      summary: List connected clients
      description: Filterable on `id`, `type`, `macAddress`, `ipAddress`, `connectedAt`, `access.type`, `access.authorized`.
      tags: [Integration · Clients]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientPage'}
          links:
            getClient:
              operationId: getConnectedClient
              parameters: {siteId: '$request.path.siteId', clientId: '$response.body#/data/0/id'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /proxy/network/integration/v1/sites/{siteId}/clients/{clientId}:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/ClientId'}
    get:
      operationId: getConnectedClient
      summary: Get connected client details
      tags: [Integration · Clients]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Client'}
          links:
            uplinkDevice:
              operationId: getDeviceDetails
              parameters: {siteId: '$request.path.siteId', deviceId: '$response.body#/uplinkDeviceId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /proxy/network/integration/v1/sites/{siteId}/clients/{clientId}/actions:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/ClientId'}
    post:
      operationId: executeClientAction
      summary: Execute a client action (authorise or revoke guest access)
      description: Applies to clients on a guest/hotspot network. The client integration API cannot rename or set fixed IPs; use `updateKnownClient`.
      x-destructive: true
      tags: [Integration · Clients]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClientActionRequest'}
            examples:
              authorise8h:
                summary: Authorise for 8 hours with a 1 GB cap
                value: {action: AUTHORIZE_GUEST_ACCESS, timeLimitMinutes: 480, dataUsageLimitMBytes: 1024}
              revoke:
                summary: Revoke guest access
                value: {action: UNAUTHORIZE_GUEST_ACCESS}
      responses:
        '200': {description: 'Action accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ------------------------------------------------------------------ Networks
  /proxy/network/integration/v1/sites/{siteId}/networks:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      operationId: listNetworks
      summary: List networks (VLANs)
      tags: [Integration · Networks]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetworkPage'}
          links:
            getNetwork:
              operationId: getNetworkDetails
              parameters: {siteId: '$request.path.siteId', networkId: '$response.body#/data/0/id'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createNetwork
      summary: Create a network (VLAN)
      description: Structural change. Needs a written plan and approval; take a backup (`systemCommand`) first.
      x-destructive: true
      tags: [Integration · Networks]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NetworkWrite'}
            examples:
              vlanOnly:
                summary: VLAN carried by switches only (no gateway interface)
                value: {management: UNMANAGED, name: VLAN 99, enabled: true, vlanId: 99}
              gatewayNetwork:
                summary: Gateway-routed network with DHCP subnet
                value:
                  management: GATEWAY
                  name: LAN_Lab
                  enabled: true
                  vlanId: 30
                  isolationEnabled: true
                  internetAccessEnabled: true
                  mdnsForwardingEnabled: false
                  zoneId: 7c1e5f2b-3d8a-4e6c-9f1b-2d0a4e3f5a6b
                  ipv4Configuration: {autoScaleEnabled: false, hostIpAddress: 172.16.30.1, prefixLength: 24}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /proxy/network/integration/v1/sites/{siteId}/networks/{networkId}:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/NetworkId'}
    get:
      operationId: getNetworkDetails
      summary: Get network details
      tags: [Integration · Networks]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}
          links:
            references:
              operationId: getNetworkReferences
              parameters: {siteId: '$request.path.siteId', networkId: '$request.path.networkId'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateNetwork
      summary: Update a network
      description: Structural change. Show a before/after diff and obtain approval first.
      x-destructive: true
      tags: [Integration · Networks]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NetworkWrite'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Network'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteNetwork
      summary: Delete a network
      description: Fails with 409 while Wi-Fi broadcasts, zones or port profiles reference it, unless `force=true`. Check `getNetworkReferences` first.
      x-destructive: true
      tags: [Integration · Networks]
      parameters: [{$ref: '#/components/parameters/Force'}]
      responses:
        '200': {description: 'Deleted'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /proxy/network/integration/v1/sites/{siteId}/networks/{networkId}/references:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/NetworkId'}
    get:
      operationId: getNetworkReferences
      summary: List objects that reference a network
      description: Impact check before changing or deleting a network (Wi-Fi broadcasts, firewall zones, port profiles and so on).
      tags: [Integration · Networks]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetworkReferences'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ------------------------------------------------------------------ WiFi
  /proxy/network/integration/v1/sites/{siteId}/wifi/broadcasts:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      operationId: listWifiBroadcasts
      summary: List Wi-Fi broadcasts (SSIDs)
      tags: [Integration · WiFi]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WifiBroadcastPage'}
          links:
            getBroadcast:
              operationId: getWifiBroadcast
              parameters: {siteId: '$request.path.siteId', wifiBroadcastId: '$response.body#/data/0/id'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createWifiBroadcast
      summary: Create a Wi-Fi broadcast
      x-destructive: true
      tags: [Integration · WiFi]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WifiBroadcastWrite'}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WifiBroadcast'}
        '400': {$ref: '#/components/responses/BadRequest'}
