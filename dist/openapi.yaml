      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallPolicyOrdering'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    put:
      operationId: updateFirewallPolicyOrdering
      summary: Reorder policies for a zone pair
      description: Structural change. Must list every user-defined policy ID of the pair.
      x-destructive: true
      tags: [Integration · Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallPolicyOrdering'}
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallPolicyOrdering'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
