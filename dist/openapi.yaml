  # ------------------------------------------------------------------ Firewall (zone-based)
  /proxy/network/integration/v1/sites/{siteId}/firewall/zones:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      operationId: listIntegrationFirewallZones
      summary: List firewall zones
      description: Official equivalent of the controller's `listFirewallZones`.
      tags: [Integration · Firewall]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallZonePage'}
          links:
            policyOrdering:
              operationId: getFirewallPolicyOrdering
              description: Policy order between the first two zones returned.
              parameters:
                siteId: '$request.path.siteId'
                sourceFirewallZoneId: '$response.body#/data/0/id'
                destinationFirewallZoneId: '$response.body#/data/1/id'
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createFirewallZone
      summary: Create a custom firewall zone
      description: Structural change. Needs a written plan and approval.
      x-destructive: true
      tags: [Integration · Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallZoneWrite'}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationFirewallZone'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /proxy/network/integration/v1/sites/{siteId}/firewall/zones/{zoneId}:
