  /proxy/network/integration/v1/sites/{siteId}/hotspot/vouchers:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      operationId: listVouchers
      summary: List hotspot vouchers
      tags: [Integration · Hotspot]
      parameters:
        - {$ref: '#/components/parameters/Offset'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Filter'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VoucherPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createVouchers
      summary: Generate hotspot vouchers
      x-destructive: true
      tags: [Integration · Hotspot]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VoucherCreateRequest'}
            examples:
              dayPass:
                summary: Five single-use 24-hour vouchers
                value: {count: 5, name: Visitors, timeLimitMinutes: 1440, authorizedGuestLimit: 1}
      responses:
        '201':
          description: Vouchers created
          content:
            application/json:
              schema:
                type: object
                properties:
                  vouchers: {type: array, items: {$ref: '#/components/schemas/Voucher'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    delete:
      operationId: deleteVouchers
      summary: Delete vouchers matching a filter
      description: '`filter` is mandatory here to prevent deleting every voucher by accident, for example `expired.eq(true)`.'
      x-destructive: true
      tags: [Integration · Hotspot]
      parameters:
        - name: filter
          in: query
          required: true
          schema: {type: string}
          examples:
            expired: {summary: 'All expired vouchers', value: "expired.eq(true)"}
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  vouchersDeleted: {type: integer, examples: [12]}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
