      security: [{ControllerSession: []}]
      responses:
        '200': {description: 'OK, content: {application/json: {schema: {type: object, additionalProperties: true}}}'}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}
  /api/backup/download:
    get:
      operationId: downloadBackup
      summary: Download a console backup
      description: Treat the file as sensitive (contains configuration and credentials). Store it in Keeper or encrypted storage only.
      tags: [UniFi OS · System]
      security: [{ControllerSession: []}]
      responses:
        '200':
          description: Backup archive
          headers:
            Content-Disposition: {schema: {type: string, examples: ['attachment; filename="backup.unifi"']}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/LegacyUnauthorized'}

  # ================================================================== CLOUD (Site Manager)
  /v1/hosts:
    servers: [{url: 'https://api.ui.com', description: UniFi Site Manager (cloud)}]
    get:
      operationId: cloudListHosts
      summary: List hosts (consoles) on the account
      tags: [Cloud · Hosts]
      parameters:
        - {$ref: '#/components/parameters/CloudPageSize'}
        - {$ref: '#/components/parameters/CloudNextToken'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/CloudEnvelope'}
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/CloudHost'}}
                      nextToken: {type: [string, 'null'], description: 'Pass back as `nextToken` for the next page; null on the last page'}
          links:
            getHost:
              operationId: cloudGetHost
              parameters: {hostId: '$response.body#/data/0/id'}
            devicesOnHost:
              operationId: cloudListDevices
              parameters: {'hostIds[]': '$response.body#/data/0/id'}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}
        '500': {$ref: '#/components/responses/CloudServerError'}
  /v1/hosts/{hostId}:
    servers: [{url: 'https://api.ui.com', description: UniFi Site Manager (cloud)}]
    get:
      operationId: cloudGetHost
      summary: Get host by ID
      tags: [Cloud · Hosts]
      parameters:
        - {name: hostId, in: path, required: true, description: 'Host `id` from `cloudListHosts`', schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/CloudEnvelope'}
                  - properties: {data: {$ref: '#/components/schemas/CloudHost'}}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '404': {$ref: '#/components/responses/CloudNotFound'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}
  /v1/sites:
    servers: [{url: 'https://api.ui.com', description: UniFi Site Manager (cloud)}]
    get:
      operationId: cloudListSites
      summary: List sites across hosts
      tags: [Cloud · Sites]
      parameters:
        - {$ref: '#/components/parameters/CloudPageSize'}
        - {$ref: '#/components/parameters/CloudNextToken'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/CloudEnvelope'}
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/CloudSite'}}
                      nextToken: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}
  /v1/devices:
    servers: [{url: 'https://api.ui.com', description: UniFi Site Manager (cloud)}]
    get:
      operationId: cloudListDevices
      summary: List devices across hosts
      description: Devices are grouped by host. Only hosts where the account is owner or super admin are included.
      tags: [Cloud · Devices]
      parameters:
        - name: 'hostIds[]'
          in: query
          description: Restrict to these hosts. Repeat the parameter for several hosts.
          schema: {type: array, items: {type: string}}
          explode: true
        - {name: time, in: query, description: 'Only devices processed at or after this time', schema: {type: string, format: date-time}}
        - {$ref: '#/components/parameters/CloudPageSize'}
        - {$ref: '#/components/parameters/CloudNextToken'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/CloudEnvelope'}
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            hostId: {type: string}
                            hostName: {type: string, examples: [CloudKey-Gen2-Plus]}
                            updatedAt: {type: string, format: date-time}
                            devices: {type: array, items: {$ref: '#/components/schemas/CloudDevice'}}
                      nextToken: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}
  /ea/isp-metrics/{type}:
    servers: [{url: 'https://api.ui.com', description: UniFi Site Manager (cloud)}]
    get:
      operationId: cloudGetIspMetrics
      summary: Get ISP metrics for all sites (Early Access)
      description: |
        WAN latency, packet loss, uptime and throughput for every site on the account.
        `5m` data is kept for at least 24 hours, `1h` data for at least 30 days.
        Give either `duration`, or `beginTimestamp` (+ optional `endTimestamp`). Early Access limit: 100 requests/minute.
      tags: [Cloud · ISP metrics]
      parameters:
        - {$ref: '#/components/parameters/IspMetricType'}
        - {name: beginTimestamp, in: query, schema: {type: string, format: date-time}}
        - {name: endTimestamp, in: query, schema: {type: string, format: date-time}}
        - name: duration
          in: query
          description: '`24h` for `5m` data; `7d` or `30d` for `1h` data.'
          schema: {type: string, enum: [24h, 7d, 30d]}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IspMetricsResponse'}
        '400': {$ref: '#/components/responses/CloudBadRequest'}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}
  /ea/isp-metrics/{type}/query:
    servers: [{url: 'https://api.ui.com', description: UniFi Site Manager (cloud)}]
    post:
      operationId: cloudQueryIspMetrics
      summary: Query ISP metrics for chosen sites (Early Access)
      description: Read-only despite using POST.
      tags: [Cloud · ISP metrics]
      parameters: [{$ref: '#/components/parameters/IspMetricType'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sites]
              properties:
                sites:
                  type: array
                  items:
                    type: object
                    required: [hostId, siteId]
                    properties:
                      hostId: {type: string}
                      siteId: {type: string}
                      beginTimestamp: {type: string, format: date-time}
                      endTimestamp: {type: string, format: date-time}
            example:
              sites:
                - {hostId: 'EXAMPLEHOSTID:123456789', siteId: 661900ae6aec8f548d49fd54, beginTimestamp: '2026-10-16T00:00:00Z', endTimestamp: '2026-10-17T00:00:00Z'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IspMetricsResponse'}
        '400': {$ref: '#/components/responses/CloudBadRequest'}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}
  /ea/sd-wan-configs:
    servers: [{url: 'https://api.ui.com', description: UniFi Site Manager (cloud)}]
    get:
      operationId: cloudListSdwanConfigs
      summary: List SD-WAN configurations (Early Access)
      description: Not used on this account (single site); listed for completeness.
      tags: [Cloud · SD-WAN]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/CloudEnvelope'}
                  - properties: {data: {type: array, items: {$ref: '#/components/schemas/SdwanConfig'}}}
          links:
            status:
              operationId: cloudGetSdwanConfigStatus
              parameters: {id: '$response.body#/data/0/id'}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}
  /ea/sd-wan-configs/{id}:
    servers: [{url: 'https://api.ui.com', description: UniFi Site Manager (cloud)}]
    get:
      operationId: cloudGetSdwanConfig
      summary: Get an SD-WAN configuration (Early Access)
      tags: [Cloud · SD-WAN]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/CloudEnvelope'}
                  - properties: {data: {$ref: '#/components/schemas/SdwanConfig'}}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '404': {$ref: '#/components/responses/CloudNotFound'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}
  /ea/sd-wan-configs/{id}/status:
    servers: [{url: 'https://api.ui.com', description: UniFi Site Manager (cloud)}]
    get:
      operationId: cloudGetSdwanConfigStatus
      summary: Get SD-WAN deployment status (Early Access)
      tags: [Cloud · SD-WAN]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/CloudEnvelope'}
                  - properties:
                      data:
                        type: object
                        additionalProperties: true
                        properties:
                          id: {type: string}
                          fingerprint: {type: string}
                          updatedAt: {type: string, format: date-time}
                          lastGeneratedAt: {type: string, format: date-time}
                          generateStatus: {type: string, examples: [OK, GENERATING, FAILED]}
                          hubs: {type: array, items: {type: object, additionalProperties: true}}
                          spokes: {type: array, items: {type: object, additionalProperties: true}}
                          errors: {type: array, items: {type: object, additionalProperties: true}}
                          warnings: {type: array, items: {type: object, additionalProperties: true}}
        '401': {$ref: '#/components/responses/CloudUnauthorized'}
        '404': {$ref: '#/components/responses/CloudNotFound'}
        '429': {$ref: '#/components/responses/CloudTooManyRequests'}

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: |
        API key sent in the `X-API-KEY` header. Used by the official APIs on both servers, but each server has its own key:
        - **Local console (Integration API):** created in *Network > Settings > Control Plane > Integrations*.
        - **Cloud (Site Manager):** created at <https://unifi.ui.com/settings/api-keys>. Limits: 10,000 requests/minute on `/v1`, 100 requests/minute on `/ea`.

        Store both in Keeper.
    ControllerSession:
      type: apiKey
      in: cookie
      name: TOKEN
      description: |
        Session cookie for the undocumented controller and UniFi OS APIs, set by `localLogin`. Send it on every call.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        CSRF token from the `X-CSRF-Token` header of the `localLogin` response. Required together with `ControllerSession`
        on every POST, PUT and DELETE (operations list both schemes). The server may rotate it via an `X-Updated-Csrf-Token`
        response header; use the newest value.
  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      description: Site UUID from `listLocalSites`.
      schema: {type: string, format: uuid, examples: [88f7af54-98f8-306a-a1c7-c9349722b1f6]}
    Site:
      name: site
      in: path
      required: true
      description: Site name (`internalReference` in `listLocalSites`); `default` on this console.
      schema: {type: string, default: default}
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Device UUID from `listAdoptedDevices`.
      schema: {type: string, format: uuid}
    ClientId:
      name: clientId
      in: path
      required: true
      description: Client UUID from `listConnectedClients`.
      schema: {type: string, format: uuid}
    NetworkId:
      name: networkId
      in: path
      required: true
      description: Network UUID from `listNetworks`.
      schema: {type: string, format: uuid}
    WifiBroadcastId:
      name: wifiBroadcastId
      in: path
      required: true
      description: Wi-Fi broadcast UUID from `listWifiBroadcasts`.
      schema: {type: string, format: uuid}
    ZoneId:
      name: zoneId
      in: path
      required: true
      description: Firewall zone UUID from `listIntegrationFirewallZones`.
      schema: {type: string, format: uuid}
    FirewallPolicyId:
      name: firewallPolicyId
      in: path
      required: true
      description: Firewall policy UUID from `listFirewallPolicies`.
      schema: {type: string, format: uuid}
    ObjectId:
      name: id
      in: path
      required: true
      description: Controller object `_id` (24-character hex).
      schema: {type: string, pattern: '^[0-9a-f]{24}$', examples: [0123456789abcdef01234567]}
    Offset:
      name: offset
      in: query
      description: Number of items to skip.
      schema: {type: integer, minimum: 0, default: 0}
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: {type: integer, minimum: 1, maximum: 200, default: 25}
    Filter:
      name: filter
      in: query
      description: |
        Integration API filter expression: `<property>.<function>(<args>)`, combined with `and(...)`, `or(...)`, `not(...)`.

        | Function | Meaning |
        |---|---|
        | `eq`, `ne` | equal / not equal |
        | `gt`, `ge`, `lt`, `le` | numeric or date comparisons |
        | `in`, `notIn` | value in / not in a list |
        | `like` | wildcard match (`*`) |
        | `isNull`, `isNotNull` | presence |
        | `contains`, `containsAny`, `containsAll`, `containsExactly`, `isEmpty` | array properties |

        Strings use single quotes. URL-encode the whole expression.
      schema: {type: string}
      examples:
        byName: {summary: 'Exact name', value: "name.eq('LAN_IoT')"}
        wildcard: {summary: 'Wildcard', value: "name.like('AP-*')"}
        wirelessGuests: {summary: 'Wireless guests', value: "and(type.eq('WIRELESS'), access.type.eq('GUEST'))"}
        needsUpdate: {summary: 'Devices with firmware updates', value: "firmwareUpdatable.eq(true)"}
    Force:
      name: force
      in: query
      description: Delete even if other objects reference this one (references are removed or reset).
      schema: {type: boolean, default: false}
    CloudPageSize:
      name: pageSize
      in: query
      description: Items per page.
      schema: {type: integer, minimum: 1, maximum: 200, default: 25}
    CloudNextToken:
      name: nextToken
      in: query
      description: Opaque token from the previous page's `nextToken`.
      schema: {type: string}
    IspMetricType:
      name: type
      in: path
      required: true
      description: Aggregation interval.
      schema: {type: string, enum: [5m, 1h]}
  headers:
    Retry-After:
      description: Seconds to wait before retrying.
      schema: {type: integer, examples: [30]}
  responses:
    # ---- Integration API errors
    BadRequest:
      description: Invalid parameter, filter expression or body
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            statusCode: 400
            statusName: BAD_REQUEST
            code: api.request.argument-type-mismatch
            message: Invalid filter expression
            timestamp: '2026-10-17T00:00:00Z'
            requestPath: /integration/v1/sites/88f7af54-98f8-306a-a1c7-c9349722b1f6/devices
            requestId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            statusCode: 401
            statusName: UNAUTHORIZED
            code: api.authentication.missing-credentials
            message: Missing credentials
            timestamp: '2026-10-17T00:00:00Z'
            requestPath: /integration/v1/sites
            requestId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            statusCode: 404
            statusName: NOT_FOUND
            code: api.resource.not-found
            message: Device not found
            timestamp: '2026-10-17T00:00:00Z'
            requestPath: /integration/v1/sites/88f7af54-98f8-306a-a1c7-c9349722b1f6/devices/00000000-0000-0000-0000-000000000000
            requestId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    Conflict:
      description: Conflicts with existing state (duplicate name or VLAN, object still referenced, device limit reached)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    # ---- Controller API errors
    LegacyOk:
      description: OK
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyEnvelope'}
    LegacyBadRequest:
      description: Request rejected (`meta.rc` = `error`)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyEnvelope'}
          example: {meta: {rc: error, msg: api.err.InvalidObject}, data: []}
    LegacyUnauthorized:
      description: No or expired session, or missing CSRF token on a write
      content:
        application/json:
          schema: {$ref: '#/components/schemas/LegacyEnvelope'}
          example: {meta: {rc: error, msg: api.err.LoginRequired}, data: []}
    # ---- Cloud errors
    CloudBadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CloudError'}
    CloudUnauthorized:
      description: Missing or invalid cloud API key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CloudError'}
          example: {code: unauthorized, httpStatusCode: 401, message: unauthorized, traceId: a7dc15e0eb4527142d7823515b15f87d}
    CloudNotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CloudError'}
    CloudTooManyRequests:
      description: Rate limit exceeded. Wait at least `Retry-After` seconds.
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CloudError'}
    CloudServerError:
      description: Server error; retry with back-off
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CloudError'}
  schemas:
    # ================================================================ shared
    MacAddress:
      type: string
      description: Lower-case, colon-separated MAC address.
      pattern: '^([0-9a-f]{2}:){5}[0-9a-f]{2}$'
      examples: ['00:00:5e:00:53:01']
    Error:
      type: object
      description: Integration API error body.
      properties:
        statusCode: {type: integer, examples: [400]}
        statusName: {type: string, examples: [BAD_REQUEST]}
        code: {type: string, description: 'Machine-readable error code'}
        message: {type: string}
        timestamp: {type: string, format: date-time}
        requestPath: {type: string}
        requestId: {type: string, format: uuid, description: 'Quote this when reporting problems'}
    Metadata:
      type: object
      readOnly: true
      additionalProperties: true
      properties:
        origin:
          type: string
          enum: [SYSTEM_DEFINED, USER_DEFINED, DERIVED]
          description: '`SYSTEM_DEFINED` objects cannot be deleted and have restricted edits.'
    Page:
      type: object
      description: Integration API page envelope.
      properties:
        offset: {type: integer, examples: [0]}
        limit: {type: integer, examples: [25]}
        count: {type: integer, description: 'Items in this page', examples: [4]}
        totalCount: {type: integer, description: 'Items matching across all pages', examples: [4]}
        data: {type: array, items: {type: object, additionalProperties: true}}

    # ================================================================ Integration: sites
    Site:
      type: object
      properties:
        id: {type: string, format: uuid, readOnly: true, examples: [88f7af54-98f8-306a-a1c7-c9349722b1f6]}
        internalReference: {type: string, description: 'Site name used by the controller API as `{site}`', examples: [default]}
        name: {type: string, examples: [Default]}
    SitePage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/Site'}}}

    # ================================================================ Integration: devices
    DeviceState:
      type: string
      enum: [ONLINE, OFFLINE, PENDING_ADOPTION, UPDATING, GETTING_READY, ADOPTING, DELETING, CONNECTION_INTERRUPTED, ISOLATED]
      examples: [ONLINE]
    DeviceBase:
      type: object
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string, examples: [USW-Lite-8-PoE Office]}
        model: {type: string, examples: [USW Lite 8 PoE]}
        macAddress: {$ref: '#/components/schemas/MacAddress'}
        ipAddress: {type: string, format: ipv4, examples: [192.168.1.10]}
        state: {$ref: '#/components/schemas/DeviceState'}
        supported: {type: boolean, description: 'False for devices too old for the Integration API'}
        firmwareVersion: {type: string, examples: ['7.1.26']}
        firmwareUpdatable: {type: boolean}
        features:
          type: array
          items: {type: string, enum: [switching, accessPoint, gateway]}
          examples: [[switching]]
    DeviceSummary:
      allOf:
        - {$ref: '#/components/schemas/DeviceBase'}
        - properties:
            interfaces:
              type: array
              description: Which interface groups `getDeviceDetails` will return.
              items: {type: string, enum: [ports, radios]}
    DevicePage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/DeviceSummary'}}}
    DevicePort:
      type: object
      properties:
        idx: {type: integer, examples: [1]}
        state: {type: string, enum: [UP, DOWN, UNKNOWN]}
        connector: {type: string, enum: [RJ45, SFP, SFPPLUS, SFP28, QSFP28]}
        speedMbps: {type: integer, examples: [1000]}
        maxSpeedMbps: {type: integer, examples: [1000]}
        poe:
          type: object
          properties:
            enabled: {type: boolean}
            standard: {type: string, enum: [802.3af, 802.3at, 802.3bt]}
            state: {type: string, enum: [UP, DOWN, LIMITED, UNKNOWN]}
            type: {type: integer, description: 'PoE type (1-4)'}
    DeviceRadio:
      type: object
      properties:
        frequencyGHz: {type: string, enum: ['2.4', '5', '6', '60']}
        wlanStandard: {type: string, examples: [802.11ax]}
        channel: {type: integer, examples: [36]}
        channelWidthMHz: {type: integer, enum: [20, 40, 80, 160, 320]}
    DeviceDetails:
      allOf:
        - {$ref: '#/components/schemas/DeviceBase'}
        - properties:
            adoptedAt: {type: string, format: date-time, readOnly: true}
            provisionedAt: {type: string, format: date-time, readOnly: true}
            configurationId: {type: string}
            uplink:
              type: object
              properties:
                deviceId: {type: string, format: uuid, description: 'Upstream device; absent on the gateway'}
            interfaces:
              type: object
              properties:
                ports: {type: array, items: {$ref: '#/components/schemas/DevicePort'}}
                radios: {type: array, items: {$ref: '#/components/schemas/DeviceRadio'}}
    PendingDevice:
      type: object
      additionalProperties: true
      properties:
        macAddress: {$ref: '#/components/schemas/MacAddress'}
        ipAddress: {type: string, format: ipv4}
        model: {type: string}
        state: {$ref: '#/components/schemas/DeviceState'}
        supported: {type: boolean}
        firmwareVersion: {type: string}
        firmwareUpdatable: {type: boolean}
        features: {type: array, items: {type: string}}
    PendingDevicePage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/PendingDevice'}}}
    DeviceStatistics:
      type: object
      readOnly: true
      properties:
        uptimeSec: {type: integer, examples: [864000]}
        lastHeartbeatAt: {type: string, format: date-time}
        nextHeartbeatAt: {type: string, format: date-time}
        loadAverage1Min: {type: number, examples: [0.12]}
        loadAverage5Min: {type: number}
        loadAverage15Min: {type: number}
        cpuUtilizationPct: {type: number, minimum: 0, maximum: 100, examples: [7.5]}
        memoryUtilizationPct: {type: number, minimum: 0, maximum: 100, examples: [41.2]}
        uplink:
          type: object
          properties:
            txRateBps: {type: integer}
            rxRateBps: {type: integer}
        interfaces:
          type: object
          properties:
            radios:
              type: array
              items:
                type: object
                properties:
                  frequencyGHz: {type: string, enum: ['2.4', '5', '6', '60']}
                  txRetriesPct: {type: number, description: 'High values (over 15%) suggest interference'}
    DeviceActionRequest:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [RESTART]}
    PortActionRequest:
      type: object
      required: [action]
      properties:
        action: {type: string, enum: [POWER_CYCLE]}

    # ================================================================ Integration: clients
    Client:
      type: object
      properties:
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string, examples: [Kitchen speaker]}
        type: {type: string, enum: [WIRED, WIRELESS, VPN, TELEPORT]}
        macAddress: {$ref: '#/components/schemas/MacAddress'}
        ipAddress: {type: string, examples: [10.88.1.50]}
        connectedAt: {type: string, format: date-time}
        uplinkDeviceId: {type: string, format: uuid, description: 'AP or switch the client is attached to'}
        access:
          type: object
          additionalProperties: true
          properties:
            type: {type: string, enum: [DEFAULT, GUEST]}
            authorized: {type: boolean, description: 'Guest clients only'}
    ClientPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/Client'}}}
    ClientActionRequest:
      oneOf:
        - {$ref: '#/components/schemas/AuthorizeGuestAccess'}
        - {$ref: '#/components/schemas/UnauthorizeGuestAccess'}
      discriminator:
        propertyName: action
        mapping:
          AUTHORIZE_GUEST_ACCESS: '#/components/schemas/AuthorizeGuestAccess'
          UNAUTHORIZE_GUEST_ACCESS: '#/components/schemas/UnauthorizeGuestAccess'
    AuthorizeGuestAccess:
      type: object
      required: [action]
      properties:
        action: {type: string, const: AUTHORIZE_GUEST_ACCESS}
        timeLimitMinutes: {type: integer, minimum: 1, maximum: 1000000}
        dataUsageLimitMBytes: {type: integer, minimum: 1, maximum: 1048576}
        rxRateLimitKbps: {type: integer, minimum: 2, maximum: 100000, description: 'Download limit'}
        txRateLimitKbps: {type: integer, minimum: 2, maximum: 100000, description: 'Upload limit'}
    UnauthorizeGuestAccess:
      type: object
      required: [action]
      properties:
        action: {type: string, const: UNAUTHORIZE_GUEST_ACCESS}

    # ================================================================ Integration: networks
    NetworkWrite:
      type: object
      required: [management, name, enabled, vlanId]
      additionalProperties: true
      properties:
        management:
          type: string
          enum: [UNMANAGED, GATEWAY, SWITCH]
          description: |
            - `GATEWAY`: routed by the gateway (subnet, DHCP, zone)
            - `SWITCH`: routed by a layer-3 switch
            - `UNMANAGED`: VLAN carried only; no UniFi interface
        name: {type: string, examples: [LAN_IoT]}
        enabled: {type: boolean}
        vlanId: {type: integer, minimum: 1, maximum: 4009, examples: [20]}
        isolationEnabled: {type: boolean, description: 'Block traffic to other local networks'}
        cellularBackupEnabled: {type: boolean}
        internetAccessEnabled: {type: boolean}
        mdnsForwardingEnabled: {type: boolean}
        zoneId: {type: string, format: uuid, description: 'Firewall zone this network belongs to'}
        ipv4Configuration:
          type: object
          additionalProperties: true
          properties:
            autoScaleEnabled: {type: boolean}
            hostIpAddress: {type: string, format: ipv4, description: 'Gateway address on this network', examples: [10.88.1.1]}
            prefixLength: {type: integer, minimum: 8, maximum: 30, examples: [24]}
    Network:
      allOf:
        - {$ref: '#/components/schemas/NetworkWrite'}
        - properties:
            id: {type: string, format: uuid, readOnly: true}
            default: {type: boolean, readOnly: true, description: 'The site''s default LAN'}
            metadata: {$ref: '#/components/schemas/Metadata'}
    NetworkPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/Network'}}}
    NetworkReferences:
      type: object
      additionalProperties: true
      properties:
        referenceResources:
          type: array
          items:
            type: object
            properties:
              resourceType: {type: string, examples: [WIFI_BROADCAST, FIREWALL_ZONE]}
              referenceCount: {type: integer}
              references: {type: array, items: {type: object, properties: {referenceId: {type: string, format: uuid}}}}

    # ================================================================ Integration: Wi-Fi
    WifiBroadcastWrite:
      type: object
      required: [type, name, enabled]
      additionalProperties: true
      properties:
        type: {type: string, enum: [STANDARD, IOT_OPTIMIZED]}
        name: {type: string, description: 'SSID', examples: [matilda-iot]}
        enabled: {type: boolean}
        network:
          type: object
          properties:
            type: {type: string, enum: [NATIVE, SPECIFIC]}
            networkId: {type: string, format: uuid, description: 'Required when `type` is `SPECIFIC`'}
        securityConfiguration:
          type: object
          additionalProperties: true
          properties:
            type: {type: string, enum: [OPEN, WPA2_PERSONAL, WPA3_PERSONAL, WPA2_WPA3_PERSONAL, WPA2_ENTERPRISE, WPA3_ENTERPRISE, WPA2_WPA3_ENTERPRISE]}
            passphrase: {type: string, format: password, writeOnly: true, minLength: 8, maxLength: 63}
        broadcastingFrequenciesGHz:
          type: array
          items: {type: string, enum: ['2.4', '5', '6']}
          examples: [['2.4']]
        hideName: {type: boolean}
        clientIsolationEnabled: {type: boolean}
        multicastToUnicastConversionEnabled: {type: boolean}
        uapsdEnabled: {type: boolean}
        advertiseDeviceName: {type: boolean, description: 'Required for `STANDARD`'}
        arpProxyEnabled: {type: boolean, description: 'Required for `STANDARD`'}
        bssTransitionEnabled: {type: boolean, description: 'Required for `STANDARD` (802.11v)'}
        broadcastingDeviceFilter:
          type: object
          additionalProperties: true
          description: Limit to specific APs or device tags.
    WifiBroadcast:
      allOf:
        - {$ref: '#/components/schemas/WifiBroadcastWrite'}
        - properties:
            id: {type: string, format: uuid, readOnly: true}
            metadata: {$ref: '#/components/schemas/Metadata'}
    WifiBroadcastPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/WifiBroadcast'}}}

    # ================================================================ Integration: firewall
    FirewallZoneWrite:
      type: object
      required: [name, networkIds]
      properties:
        name: {type: string, examples: [IoT]}
        networkIds: {type: array, items: {type: string, format: uuid}}
    IntegrationFirewallZone:
      allOf:
        - {$ref: '#/components/schemas/FirewallZoneWrite'}
        - properties:
            id: {type: string, format: uuid, readOnly: true}
            metadata: {$ref: '#/components/schemas/Metadata'}
    FirewallZonePage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/IntegrationFirewallZone'}}}
    FirewallEndpoint:
      type: object
      required: [zoneId]
      additionalProperties: true
      properties:
        zoneId: {type: string, format: uuid}
        trafficFilter:
          type: object
          additionalProperties: true
          description: Optional narrowing by IP, port, network, MAC, region or application (may reference a traffic matching list).
    FirewallPolicyWrite:
      type: object
      required: [name, enabled, action, source, destination]
      additionalProperties: true
      properties:
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        action: {type: string, enum: [ALLOW, BLOCK, REJECT]}
        source: {$ref: '#/components/schemas/FirewallEndpoint'}
        destination: {$ref: '#/components/schemas/FirewallEndpoint'}
        ipProtocolScope:
          type: object
          additionalProperties: true
          properties:
            ipVersion: {type: string, enum: [IPV4, IPV6, IPV4_AND_IPV6]}
        connectionStateFilter:
          type: array
          items: {type: string, enum: [NEW, ESTABLISHED, RELATED, INVALID]}
        loggingEnabled: {type: boolean}
        schedule: {type: object, additionalProperties: true}
    FirewallPolicy:
      allOf:
        - {$ref: '#/components/schemas/FirewallPolicyWrite'}
        - properties:
            id: {type: string, format: uuid, readOnly: true}
            index: {type: integer, readOnly: true, description: 'Evaluation position within its zone pair'}
            metadata: {$ref: '#/components/schemas/Metadata'}
    FirewallPolicyPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/FirewallPolicy'}}}
    FirewallPolicyOrdering:
      type: object
      required: [orderedFirewallPolicyIds]
      additionalProperties: true
      properties:
        orderedFirewallPolicyIds:
          description: User-defined policy IDs, first evaluated first.
          type: array
          items: {type: string, format: uuid}
    TrafficMatchingListWrite:
      type: object
      required: [type, name, items]
      additionalProperties: true
      properties:
        type: {type: string, enum: [PORTS, IPV4_ADDRESSES, IPV6_ADDRESSES]}
        name: {type: string}
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              type: {type: string, examples: [PORT_NUMBER, PORT_NUMBER_RANGE, IP_ADDRESS, SUBNET, IP_ADDRESS_RANGE]}
              value: {description: 'Single port or address', oneOf: [{type: integer}, {type: string}]}
              start: {description: 'Range start', oneOf: [{type: integer}, {type: string}]}
              stop: {description: 'Range end', oneOf: [{type: integer}, {type: string}]}
    TrafficMatchingList:
      allOf:
        - {$ref: '#/components/schemas/TrafficMatchingListWrite'}
        - properties:
            id: {type: string, format: uuid, readOnly: true}
    TrafficMatchingListPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/TrafficMatchingList'}}}

    # ================================================================ Integration: ACL rules
    AclRuleWrite:
      type: object
      required: [type, name, enabled, action]
      additionalProperties: true
      properties:
        type: {type: string, enum: [IPV4, MAC], description: 'Layer-3 (IP) or layer-2 (MAC) rule'}
        name: {type: string}
        description: {type: string}
        enabled: {type: boolean}
        action: {type: string, enum: [ALLOW, BLOCK]}
        index: {type: integer, description: 'Position in the rule list'}
        sourceFilter: {type: object, additionalProperties: true}
        destinationFilter: {type: object, additionalProperties: true}
        protocolFilter: {type: array, items: {type: string, examples: [TCP, UDP]}}
        enforcingDeviceFilter: {type: object, additionalProperties: true, description: 'Which switches enforce the rule'}
    AclRule:
      allOf:
        - {$ref: '#/components/schemas/AclRuleWrite'}
        - properties:
            id: {type: string, format: uuid, readOnly: true}
            metadata: {$ref: '#/components/schemas/Metadata'}
    AclRulePage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/AclRule'}}}
    AclRuleOrdering:
      type: object
      required: [orderedAclRuleIds]
      properties:
        orderedAclRuleIds: {type: array, items: {type: string, format: uuid}}

    # ================================================================ Integration: DNS
    DnsPolicyBase:
      type: object
      required: [type, enabled, domain]
      additionalProperties: true
      properties:
        type: {type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, FORWARD_DOMAIN]}
        enabled: {type: boolean}
        domain: {type: string, examples: [homeassistant.matilda.network]}
        ttlSeconds: {type: integer, minimum: 0, examples: [3600]}
    DnsPolicyWrite:
      description: One variant per record `type`.
      oneOf:
        - {$ref: '#/components/schemas/DnsA'}
        - {$ref: '#/components/schemas/DnsAAAA'}
        - {$ref: '#/components/schemas/DnsCNAME'}
        - {$ref: '#/components/schemas/DnsMX'}
        - {$ref: '#/components/schemas/DnsTXT'}
        - {$ref: '#/components/schemas/DnsSRV'}
        - {$ref: '#/components/schemas/DnsForwardDomain'}
      discriminator:
        propertyName: type
        mapping:
          A: '#/components/schemas/DnsA'
          AAAA: '#/components/schemas/DnsAAAA'
          CNAME: '#/components/schemas/DnsCNAME'
          MX: '#/components/schemas/DnsMX'
          TXT: '#/components/schemas/DnsTXT'
          SRV: '#/components/schemas/DnsSRV'
          FORWARD_DOMAIN: '#/components/schemas/DnsForwardDomain'
    DnsA:
      allOf:
        - {$ref: '#/components/schemas/DnsPolicyBase'}
        - required: [ipv4Address]
          properties:
            type: {const: A}
            ipv4Address: {type: string, format: ipv4}
    DnsAAAA:
      allOf:
        - {$ref: '#/components/schemas/DnsPolicyBase'}
        - required: [ipv6Address]
          properties:
            type: {const: AAAA}
            ipv6Address: {type: string, format: ipv6}
    DnsCNAME:
      allOf:
        - {$ref: '#/components/schemas/DnsPolicyBase'}
        - required: [targetDomain]
          properties:
            type: {const: CNAME}
            targetDomain: {type: string}
    DnsMX:
      allOf:
        - {$ref: '#/components/schemas/DnsPolicyBase'}
        - required: [mailServerDomain, priority]
          properties:
            type: {const: MX}
            mailServerDomain: {type: string}
            priority: {type: integer, minimum: 0}
    DnsTXT:
      allOf:
        - {$ref: '#/components/schemas/DnsPolicyBase'}
        - required: [text]
          properties:
            type: {const: TXT}
            text: {type: string}
    DnsSRV:
      allOf:
        - {$ref: '#/components/schemas/DnsPolicyBase'}
        - properties:
            type: {const: SRV}
            serverDomain: {type: string}
            service: {type: string, examples: [_sip]}
            protocol: {type: string, examples: [_tcp]}
            port: {type: integer, minimum: 1, maximum: 65535}
            priority: {type: integer, minimum: 0}
            weight: {type: integer, minimum: 0}
    DnsForwardDomain:
      allOf:
        - {$ref: '#/components/schemas/DnsPolicyBase'}
        - required: [ipAddress]
          properties:
            type: {const: FORWARD_DOMAIN}
            ipAddress: {type: string, description: 'Upstream resolver for this domain'}
    DnsPolicy:
      allOf:
        - {$ref: '#/components/schemas/DnsPolicyWrite'}
        - type: object
          properties:
            id: {type: string, format: uuid, readOnly: true}
            metadata: {$ref: '#/components/schemas/Metadata'}
    DnsPolicyPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/DnsPolicy'}}}

    # ================================================================ Integration: hotspot
    VoucherCreateRequest:
      type: object
      required: [name, timeLimitMinutes]
      properties:
        count: {type: integer, minimum: 1, maximum: 1000, default: 1}
        name: {type: string, description: 'Label shown in the UI'}
        timeLimitMinutes: {type: integer, minimum: 1, maximum: 1000000}
        authorizedGuestLimit: {type: integer, minimum: 1, description: 'Devices per voucher; omit for unlimited'}
        dataUsageLimitMBytes: {type: integer, minimum: 1, maximum: 1048576}
        rxRateLimitKbps: {type: integer, minimum: 2, maximum: 100000}
        txRateLimitKbps: {type: integer, minimum: 2, maximum: 100000}
    Voucher:
      allOf:
        - {$ref: '#/components/schemas/VoucherCreateRequest'}
        - properties:
            id: {type: string, format: uuid, readOnly: true}
            code: {type: string, readOnly: true, examples: ['4861409510']}
            createdAt: {type: string, format: date-time, readOnly: true}
            activatedAt: {type: [string, 'null'], format: date-time, readOnly: true}
            expiresAt: {type: [string, 'null'], format: date-time, readOnly: true}
            expired: {type: boolean, readOnly: true}
            authorizedGuestCount: {type: integer, readOnly: true}
    VoucherPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/Voucher'}}}

    # ================================================================ Integration: supporting resources
    NamedResource:
      type: object
      additionalProperties: true
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        metadata: {$ref: '#/components/schemas/Metadata'}
    NamedResourcePage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties: {data: {type: array, items: {$ref: '#/components/schemas/NamedResource'}}}
    VpnServerPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties:
            data:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/NamedResource'}
                  - properties:
                      type: {type: string, examples: [WIREGUARD, OPENVPN, L2TP, TELEPORT]}
                      enabled: {type: boolean}
    VpnTunnelPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties:
            data:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/NamedResource'}
                  - properties:
                      type: {type: string, examples: [IPSEC, OPENVPN, SITE_MAGIC]}
    DeviceTagPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties:
            data:
              type: array
              items:
                allOf:
                  - {$ref: '#/components/schemas/NamedResource'}
                  - properties:
                      deviceIds: {type: array, items: {type: string, format: uuid}}
    CountryPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties:
            data:
              type: array
              items:
                type: object
                properties:
                  code: {type: string, description: 'ISO 3166-1 alpha-2', examples: [GB]}
                  name: {type: string, examples: [United Kingdom]}
    DpiPage:
      allOf:
        - {$ref: '#/components/schemas/Page'}
        - properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  name: {type: string, examples: [Streaming Media]}

    # ================================================================ Controller API
    LegacyEnvelope:
      type: object
      description: Every `/api/s/{site}` response uses this wrapper. Check `meta.rc` - errors can arrive with HTTP 200.
      properties:
        meta:
          type: object
          properties:
            rc: {type: string, enum: [ok, error]}
            msg: {type: string, description: 'Error key when `rc` is `error`, for example `api.err.LoginRequired`, `api.err.NoSiteContext`, `api.err.InvalidObject`'}
        data:
          type: array
          items: {type: object, additionalProperties: true}
    LegacyHealth:
      type: object
      additionalProperties: true
      properties:
        subsystem: {type: string, enum: [wan, www, lan, wlan, vpn]}
        status: {type: string, enum: [ok, warning, error, unknown]}
        num_adopted: {type: integer}
        num_disconnected: {type: integer}
        num_pending: {type: integer}
        num_user: {type: integer, description: 'Clients on this subsystem'}
        num_guest: {type: integer}
        num_iot: {type: integer}
        wan_ip: {type: string, examples: [203.0.113.10]}
        isp_name: {type: string}
        latency: {type: integer, description: 'ms (www subsystem)'}
        uptime: {type: integer, description: 'seconds'}
        xput_down: {type: number, description: 'Last speed test, Mbps'}
        xput_up: {type: number, description: 'Last speed test, Mbps'}
    LegacySysInfo:
      type: object
      additionalProperties: true
      properties:
        version: {type: string, description: 'Network Application version', examples: ['9.4.19']}
        build: {type: string}
        hostname: {type: string}
        name: {type: string}
        timezone: {type: string, examples: [Europe/London]}
        uptime: {type: integer}
        update_available: {type: boolean}
        ip_addrs: {type: array, items: {type: string}}
    LegacyEvent:
      type: object
      additionalProperties: true
      properties:
        _id: {type: string}
        key: {type: string, examples: [EVT_SW_Lost_Contact, EVT_WU_Connected]}
        msg: {type: string}
        subsystem: {type: string, examples: [lan, wlan]}
        time: {type: integer, description: 'Unix epoch milliseconds'}
        datetime: {type: string, format: date-time}
        archived: {type: boolean, description: 'Alarms only'}
    LegacyDeviceBasic:
      type: object
      additionalProperties: true
      properties:
        mac: {$ref: '#/components/schemas/MacAddress'}
        state: {type: integer, description: '0 disconnected, 1 connected, 2 pending, 4 upgrading, 5 provisioning, 6 heartbeat missed, 7 adopting, 11 isolated'}
        adopted: {type: boolean}
        disabled: {type: boolean}
        type: {type: string, enum: [uap, usw, ugw, udm, uxg]}
        model: {type: string}
        name: {type: string}
    LegacyDevice:
      allOf:
        - {$ref: '#/components/schemas/LegacyDeviceBasic'}
        - type: object
          properties:
            _id: {type: string}
            ip: {type: string}
            version: {type: string}
            upgradable: {type: boolean}
            uptime: {type: integer}
            port_table:
              type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  port_idx: {type: integer}
                  name: {type: string}
                  up: {type: boolean}
                  speed: {type: integer}
                  poe_enable: {type: boolean}
                  poe_power: {type: string, description: 'Watts'}
                  stp_state: {type: string, examples: [forwarding, blocking, disabled]}
            radio_table: {type: array, items: {type: object, additionalProperties: true}}
            vap_table: {type: array, items: {type: object, additionalProperties: true}}
    LegacyNetworkConf:
      type: object
      additionalProperties: true
      properties:
        _id: {type: string}
        name: {type: string, examples: [LAN_IoT]}
        purpose: {type: string, enum: [corporate, guest, wan, vlan-only, remote-user-vpn, site-vpn]}
        vlan: {type: integer}
        vlan_enabled: {type: boolean}
        ip_subnet: {type: string, examples: [10.88.1.1/24]}
        dhcpd_enabled: {type: boolean}
        dhcpd_start: {type: string, examples: [10.88.1.101]}
        dhcpd_stop: {type: string, examples: [10.88.1.254]}
        dhcpd_leasetime: {type: integer}
        igmp_snooping: {type: boolean}
        mdns_enabled: {type: boolean}
        firewall_zone_id: {type: string}
        networkgroup: {type: string, examples: [LAN]}
    FirewallGroup:
      type: object
      required: [name, group_type, group_members]
      properties:
        _id: {type: string, readOnly: true}
        site_id: {type: string, readOnly: true}
        name: {type: string}
        group_type: {type: string, enum: [address-group, ipv6-address-group, port-group]}
        group_members:
          type: array
          description: Addresses/CIDRs, or ports and port ranges as strings.
          items: {type: string}
    FirewallZone:
      type: object
      properties:
        _id: {type: string}
        name: {type: string, examples: [Internal, External, Gateway, Vpn, Hotspot, Dmz, IoT, Sonos]}
        zone_key: {type: string, examples: [internal]}
        default_zone: {type: boolean}
        attr_no_edit: {type: boolean, description: 'System zone; cannot be edited'}
        network_ids: {type: array, items: {type: string}}
    KnownClientWrite:
      type: object
      description: Subset of the known-client record used for fixed-IP and naming changes.
      additionalProperties: true
      properties:
        mac: {$ref: '#/components/schemas/MacAddress'}
        name: {type: string}
        note: {type: string}
        noted: {type: boolean, description: 'Set true when `note` is present'}
        use_fixedip: {type: boolean}
        fixed_ip: {type: string, format: ipv4, description: 'Must be in .1-.100 (static block) of the network''s subnet'}
        network_id: {type: string, description: '`_id` from `listNetworkConfig`'}
        blocked: {type: boolean}
    KnownClient:
      allOf:
        - {$ref: '#/components/schemas/KnownClientWrite'}
        - properties:
            _id: {type: string, readOnly: true}
            oui: {type: string, readOnly: true}
            first_seen: {type: integer, readOnly: true}
            last_seen: {type: integer, readOnly: true}
    ActiveClient:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        mac: {$ref: '#/components/schemas/MacAddress'}
        name: {type: string}
        display_name: {type: string}
        hostname: {type: string}
        ip: {type: string}
        fixed_ip: {type: string}
        use_fixedip: {type: boolean}
        is_wired: {type: boolean}
        network_id: {type: string}
        network_name: {type: string}
        vlan: {type: integer}
        oui: {type: string, description: 'Manufacturer from the MAC prefix'}
        status: {type: string, examples: [online, offline]}
        last_uplink_mac: {type: string}
        last_uplink_name: {type: string}
        signal: {type: integer, description: 'dBm (wireless only)', examples: [-58]}
        satisfaction: {type: integer, minimum: 0, maximum: 100}
        uptime: {type: integer, description: 'seconds'}
        tx_bytes: {type: integer}
        rx_bytes: {type: integer}

    # ================================================================ Cloud (Site Manager)
    CloudEnvelope:
      type: object
      required: [httpStatusCode]
      properties:
        httpStatusCode: {type: integer, examples: [200]}
        traceId: {type: string, description: 'Quote this when contacting Ubiquiti support'}
    CloudError:
      allOf:
        - {$ref: '#/components/schemas/CloudEnvelope'}
        - properties:
            code: {type: string}
            message: {type: string}
    CloudHost:
      type: object
      additionalProperties: true
      properties:
        id: {type: string, examples: ['EXAMPLEHOSTID:123456789']}
        hardwareId: {type: string, format: uuid}
        type: {type: string, examples: [console, network-server]}
        ipAddress: {type: string, examples: [203.0.113.10]}
        owner: {type: boolean}
        isBlocked: {type: boolean}
        registrationTime: {type: string, format: date-time}
        lastConnectionStateChange: {type: string, format: date-time}
        latestBackupTime: {type: string, format: date-time}
        reportedState:
          type: object
          additionalProperties: true
          description: Live state reported by the console (name, firmware, controllers, WAN, location...).
          properties:
            hostname: {type: string}
            name: {type: string, examples: [CloudKey-Gen2-Plus]}
            version: {type: string, description: 'UniFi OS version'}
            state: {type: string, examples: [connected]}
            controllers: {type: array, items: {type: object, additionalProperties: true}}
        userData: {type: object, additionalProperties: true}
    CloudSite:
      type: object
      additionalProperties: true
      properties:
        siteId: {type: string}
        hostId: {type: string}
        meta:
          type: object
          additionalProperties: true
          properties:
            name: {type: string, examples: [default]}
            desc: {type: string, examples: [Default]}
            timezone: {type: string, examples: [Europe/London]}
            gatewayMac: {$ref: '#/components/schemas/MacAddress'}
        statistics:
          type: object
          additionalProperties: true
          description: Device and client counts, ISP info, WAN uptime percentage.
        permission: {type: string, enum: [owner, admin, super-admin, read-only]}
        isOwner: {type: boolean}
    CloudDevice:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        mac: {type: string}
        name: {type: string}
        model: {type: string}
        shortname: {type: string, examples: [USL8LP]}
        ip: {type: string}
        productLine: {type: string, examples: [network, protect]}
        status: {type: string, examples: [online, offline]}
        version: {type: string}
        firmwareStatus: {type: string, examples: [upToDate, updateAvailable]}
        updateAvailable: {type: [string, 'null']}
        isConsole: {type: boolean}
        isManaged: {type: boolean}
        adoptionTime: {type: [string, 'null'], format: date-time}
        startupTime: {type: string, format: date-time}
        note: {type: [string, 'null']}
        uidb: {type: object, additionalProperties: true, description: 'Product image references'}
    IspMetricsResponse:
      allOf:
        - {$ref: '#/components/schemas/CloudEnvelope'}
        - properties:
            data:
              type: array
              items:
                type: object
                properties:
                  metricType: {type: string, enum: [5m, 1h]}
                  hostId: {type: string}
                  siteId: {type: string}
                  periods:
                    type: array
                    items:
                      type: object
                      properties:
                        metricTime: {type: string, format: date-time}
                        version: {type: string}
                        data:
                          type: object
                          properties:
                            wan:
                              type: object
                              additionalProperties: true
                              properties:
                                avgLatency: {type: number, description: 'ms'}
                                maxLatency: {type: number, description: 'ms'}
                                packetLoss: {type: number, description: 'Percent'}
                                uptime: {type: number, description: 'Percent of the period'}
                                downtime: {type: number}
                                download_kbps: {type: number}
                                upload_kbps: {type: number}
                                ispName: {type: string}
                                ispAsn: {type: string}
    SdwanConfig:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string}
        variant: {type: string, examples: [hub-spoke, mesh]}
        settings: {type: object, additionalProperties: true}
