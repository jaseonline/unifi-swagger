          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DnsPolicyPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createDnsPolicy
      summary: Create a DNS record or forwarder
      description: The body shape depends on `type`; pick an example to see each variant.
      x-destructive: true
      tags: [Integration · DNS]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DnsPolicyWrite'}
            examples:
              aRecord:
                summary: A record
                value: {type: A, enabled: true, domain: homeassistant.matilda.network, ipv4Address: 192.168.1.20, ttlSeconds: 3600}
              cname:
                summary: CNAME record
                value: {type: CNAME, enabled: true, domain: ha.matilda.network, targetDomain: homeassistant.matilda.network, ttlSeconds: 3600}
              mx:
                summary: MX record
                value: {type: MX, enabled: true, domain: example.com, mailServerDomain: mail.example.com, priority: 10, ttlSeconds: 3600}
              forward:
                summary: Forward a domain to another resolver
                value: {type: FORWARD_DOMAIN, enabled: true, domain: corp.example, ipAddress: 198.51.100.53}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DnsPolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
