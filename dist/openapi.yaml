        '404': {$ref: '#/components/responses/NotFound'}
    put:
      operationId: updateFirewallZone
      summary: Update a firewall zone (name, member networks)
      description: Structural change. Show a before/after diff and obtain approval first. System-defined zones cannot be renamed.
      x-destructive: true
      tags: [Integration · Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallZoneWrite'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationFirewallZone'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
